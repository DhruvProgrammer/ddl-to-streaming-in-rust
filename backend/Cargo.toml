[package]
name = "ddl-player"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "High-performance DDL streaming proxy (Vite for DDL streaming)"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "query", "matched-path", "original-uri"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", default-features = false, features = ["io", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["json", "env-filter", "fmt", "ansi"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = { version = "0.3", features = ["std"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "charset", "json"] }
serde_json = "1"
url = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }

[[bench]]
name = "engine"
harness = false

# Test targets live under ../tests to match the documented repository layout.
[[test]]
name = "integration"
path = "../tests/integration/proxy.rs"
harness = true

[[test]]
name = "chaos"
path = "../tests/chaos/network.rs"
harness = true

[[test]]
name = "leaks"
path = "../tests/chaos/leaks.rs"
harness = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
debug = true

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
